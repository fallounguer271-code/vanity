<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANITY RP | LOGIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #050505;
            font-family: 'Montserrat', sans-serif;
            display: flex; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            background-image: radial-gradient(circle at center, #1a1505 0%, #050505 100%);
        }

        .login-card {
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 40px;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(15px);
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 1);
            position: relative;
        }

        .login-card::before {
            content: ''; position: absolute; top: 0; left: 25%; width: 50%; height: 2px;
            background: #D4AF37; box-shadow: 0 0 15px #D4AF37;
        }

        .logo-small {
            width: 100px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px #D4AF37);
        }

        h2 {
            font-family: 'Cinzel', serif;
            color: #D4AF37;
            letter-spacing: 5px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: #fff;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #D4AF37;
            background: rgba(212, 175, 55, 0.05);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: #D4AF37;
            color: #000;
            border: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.4s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #fff;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        .footer-links {
            margin-top: 20px;
            font-size: 0.7em;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            transition: 0.3s;
        }

        .footer-links a:hover { color: #D4AF37; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="vanitygif.gif" alt="VANITY" class="logo-small">
        <h2>Login</h2>
        
        <form action="process-login.php" method="POST">
            <div class="input-group">
                <input type="text" placeholder="USERNAME" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="PASSWORD" required>
            </div>
            <button type="submit" class="btn-login">Access Empire</button>
        </form>

        <div class="footer-links">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

</body>
</html>
